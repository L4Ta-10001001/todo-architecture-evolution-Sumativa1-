spring.application.name=todo-app
server.port=8080

# ANTI-PATTERN: hardcoded datasource configuration scattered in code.
# The URL below is duplicated inside Main.java, which is itself a problem.
spring.datasource.url=jdbc:sqlite:todo.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# We disable JPA auto-configuration to keep the project "raw".
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
