spring.application.name=todo-app
server.port=8080

# SQLite datasource
spring.datasource.url=jdbc:sqlite:todo.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=

# JPA disabled on purpose: this branch uses plain JDBC inside the
# persistence adapter. Hibernate would re-introduce framework coupling
# at the infrastructure boundary.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
spring.jpa.hibernate.ddl-auto=none
